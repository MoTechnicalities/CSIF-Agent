services:
  csif-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/motechnicalities/csif-agent:latest
    container_name: csif-agent
    ports:
      - "8080:8080"
    environment:
      - CSIF_BANK_PATH=/data/my_brain.rwif
      - CSIF_LOBES_DIR=/data/lobes
      - CSIF_LOBES_POLL_SECS=5
    volumes:
      - csif-agent-data:/data
      - ./lobes:/data/lobes:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

