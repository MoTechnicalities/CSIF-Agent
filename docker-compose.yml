services:
  csif-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/motechnicalities/csif-agent:latest
    container_name: csif-agent
    ports:
      - "8080:8080"
    environment:
      - CSIF_BANK_PATH=/data/my_brain.rwif
      - CSIF_BOOTSTRAP_BASE_ON_EMPTY=1
      - CSIF_BOOTSTRAP_BASE_MODE=ensure
      - CSIF_LOBES_DIR=/app/lobes
      - CSIF_LOBES_POLL_SECS=5
      - CSIF_ADMIN_TOKEN=${CSIF_ADMIN_TOKEN:-}
      - CSIF_PLAY_ENABLED=1
      - CSIF_PLAY_POLL_SECS=300
      - CSIF_PLAY_MAX_MS=50
      - CSIF_PLAY_MAX_CYCLES_PER_TICK=1
      - CSIF_PLAY_HISTORY_LIMIT=100
      - CSIF_PLAY_FORCE_COOLDOWN_MS=2000
      - CSIF_PLAY_TRACE_SLOW_MS=25
      - CSIF_PLAY_APPROVAL_TOKEN=${CSIF_PLAY_APPROVAL_TOKEN:-}
      - CSIF_OBSERVE_ENABLED=1
      - CSIF_OBSERVE_POLL_SECS=21600
      - CSIF_OBSERVE_MAX_MS=50
      - CSIF_OBSERVE_HISTORY_LIMIT=100
      - CSIF_OBSERVE_FORCE_COOLDOWN_MS=2000
      - CSIF_OBSERVE_SOURCE=internal:observation
      - CSIF_OBSERVE_QUERY=Is a whale a reptile?
      - CSIF_OBSERVE_APPROVAL_TOKEN=${CSIF_OBSERVE_APPROVAL_TOKEN:-}
      - CSIF_OBSERVE_NO_PATH_THRESHOLD=1
      - CSIF_OBSERVE_CONTRADICTION_THRESHOLD=1
      - CSIF_LOOP_AUDIT_LOG_PATH=/data/loop_audit.jsonl
    volumes:
      - csif-agent-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 180s

