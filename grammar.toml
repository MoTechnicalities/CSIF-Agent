version = "v2"

[query]
what_is = "^what is (?:a|an)?\\s*(.+?)\\?$"
is_a_confirm = "^is (?:a|an )?(.+?) (?:a|an) (.+?)\\?$"
causes_confirm = "^does (?:a|an )?(.+?) cause (.+?)\\?$"
has_property_confirm = "^does (?:a|an )?(.+?) have (.+?)\\?$"
add_compute = "^what is\\s+(-?\\d+(?:\\.\\d+)?)\\s*\\+\\s*(-?\\d+(?:\\.\\d+)?)\\?$"

[teach]
is_a = "^(?:a|an) (.+?) is (?:a|an) (.+)$"
causes = "^(.+?) causes (.+)$"
has_property = "^(?:a|an) (.+?) has (.+)$"
