version = "v2"

[query]
what_is = "^what is (?:(?:a|an)\\s+)?(.+?)\\?$"
is_a_confirm = "^is (?:(?:a|an)\\s+)?(.+?) (?:a|an) (.+?)\\?$"
causes_confirm = "^does (?:(?:a|an)\\s+)?(.+?) cause (.+?)\\?$"
has_property_confirm = "^does (?:(?:a|an)\\s+)?(.+?) have (.+?)\\?$"
add_compute = "^what is\\s+(-?\\d+(?:\\.\\d+)?)\\s*([+\\-*/])\\s*(-?\\d+(?:\\.\\d+)?)\\?$"

[teach]
is_a = "^(?:a|an) (.+?) is (?:a|an) (.+)$"
causes = "^(.+?) causes (.+)$"
has_property = "^(?:a|an) (.+?) has (.+)$"

[relations]
is_a = 999999
causes = 3
has_property = 1

[templates.describe]
classification = "A {subject} is {direct}."
properties_intro = "It can be"
properties_outro = "."
property_connector = "and"
subtypes_intro = "There are several types, including"
subtypes_outro = "."
subtype_connector = "and"
oxford_comma = true
max_subtype_examples = 5
